<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1515">
  <title>{% block title %}StudyFlow{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand-mark.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='font.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='workspace-pages.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='refinement.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='study-desk.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='mobile.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='unified-workspace.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">{{ t("Skip to tasks") }}</a>
  {% block content %}{% endblock %}
  <script id="ui-strings" type="application/json">{{ {'saving': t('Saving…'), 'create': t('Create task'), 'save': t('Save changes')}|tojson }}</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
