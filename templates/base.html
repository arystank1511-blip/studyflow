<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15171d" media="(prefers-color-scheme: dark)">
  <meta name="description" content="StudyFlow — a bilingual planner for student deadlines, courses and progress.">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <title>{% block title %}StudyFlow{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand-mark.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <meta name="apple-mobile-web-app-title" content="StudyFlow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='notebook.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">{{ t("Skip to tasks") }}</a>
  {% block content %}{% endblock %}
  <script id="ui-strings" type="application/json">{{ {'saving': t('Saving…'), 'create': t('Create task'), 'save': t('Save changes')}|tojson }}</script>
  <script src="{{ url_for('static', filename='dates.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script src="{{ url_for('static', filename='app-v2.js') }}"></script>
  <script src="{{ url_for('static', filename='study.js') }}"></script>
  <script src="{{ url_for('static', filename='scan.js') }}"></script>
</body>
</html>
