{% extends 'base.html' %}
{% block title %}{{ error.code }} · StudyFlow{% endblock %}
{% block content %}
<main class="workspace-board error-page" id="main-content">
  <p class="eyebrow">STUDYFLOW / {{ error.code }}</p>
  <h1>{{ error.name }}</h1>
  <p>{{ error.description }}</p>
  <a class="secondary" href="{{ url_for('index') }}">Return to dashboard</a>
</main>
{% endblock %}
